<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Shield Outer -->
  <path d="M100 24 C140 24, 168 38, 168 76 C168 128, 128 162, 100 178 C72 162, 32 128, 32 76 C32 38, 60 24, 100 24 Z" 
        fill="#FFFFFF" stroke="#1D4A27" stroke-width="10" stroke-linejoin="round" />
  
