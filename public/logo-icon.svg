  <circle cx="68" cy="78" r="4.5" fill="#FFFFFF" stroke="#1D4A27" stroke-width="2.5"/>

  <!-- Right Leaf with Circuit Line & Node -->
  <path d="M104 105 C128 98, 148 78, 148 52 C124 54, 106 74, 104 105 Z" 
        fill="#3B9245" stroke="#1D4A27" stroke-width="5" stroke-linejoin="round" />
  <path d="M112 94 C124 82, 134 72, 134 62" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="134" cy="62" r="4.5" fill="#FFFFFF" stroke="#1D4A27" stroke-width="2.5"/>

  <!-- Central Shoot -->
  <path d="M100 92 L100 64" stroke="#1D4A27" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="100" cy="62" r="4" fill="#1D4A27"/>

  <!-- Circuit Root Branches -->
  <path d="M92 134 L72 142 L66 142" stroke="#1D4A27" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="142" r="3.5" fill="#1D4A27"/>

  <path d="M108 128 L122 136 L122 144" stroke="#1D4A27" stroke-width="4" stroke-linecap="round"/>
  <circle cx="122" cy="146" r="3.5" fill="#1D4A27"/>

  <path d="M100 138 L100 156" stroke="#1D4A27" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="158" r="3.5" fill="#1D4A27"/>
</svg>
