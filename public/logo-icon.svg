  <path d="M100 120 L156 80 L100 166 L44 80 Z" fill="#C5E3CA" opacity="0.4"/>

  <!-- Plant Stem & Roots with Circuit paths -->
  <path d="M100 138 L100 95" stroke="#1D4A27" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left Leaf with Circuit Line & Node -->
  <path d="M96 112 C74 112, 54 94, 52 72 C74 72, 94 90, 96 112 Z" 
        fill="#4EA858" stroke="#1D4A27" stroke-width="5" stroke-linejoin="round" />
