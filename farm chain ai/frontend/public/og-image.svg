<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g stroke="#10b981" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(80, 70)">
    <rect width="360" height="42" rx="21" fill="#065f46" stroke="#059669" stroke-width="1.5"/>
    <text x="25" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0" letter-spacing="1">🇮🇳 NATIONAL KRISHI LEDGER</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">
    FarmChain AI
  </text>
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="url(#textGrad)">
    Transparent Farm-to-Consumer Traceability
  </text>

  <!-- Subtitle / Tamil headline -->
  <text x="80" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">
    விவசாயி முதல் நுகர்வோர் வரை ஒளிவுமறைவற்ற தளம் • SHA-256 கிரிப்டோ லெட்ஜர்
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 410)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="280" height="56" rx="14" fill="#0f766e" fill-opacity="0.3" stroke="#14b8a6" stroke-width="1"/>
    <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">
      ⚡ SHA-256 Hash Chain
    </text>

    <!-- Pill 2 -->
    <rect x="305" y="0" width="280" height="56" rx="14" fill="#0f766e" fill-opacity="0.3" stroke="#14b8a6" stroke-width="1"/>
    <text x="330" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">
      🤖 AI Quality Classifier
    </text>

    <!-- Pill 3 -->
    <rect x="610" y="0" width="310" height="56" rx="14" fill="#0f766e" fill-opacity="0.3" stroke="#14b8a6" stroke-width="1"/>
    <text x="635" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">
      📈 APMC Mandi Benchmarks
    </text>
  </g>

  <!-- Footer branding -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#334155" stroke-width="1"/>
  <text x="80" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
    Department of Agricultural Marketing &amp; TNeGA Prototype • e-NAM Network Compatible
  </text>
  <text x="1120" y="565" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#34d399">
    farmchain.gov.in
  </text>
</svg>
